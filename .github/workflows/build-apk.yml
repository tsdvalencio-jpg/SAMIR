name: Gerar APK - Casa do Samir

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android 16 / API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Incorporar gerador de PDF no APK
        shell: bash
        run: |
          mkdir -p app/src/main/assets/vendor
          curl --fail --location --retry 3 --silent --show-error \
            https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js \
            --output app/src/main/assets/vendor/jspdf.umd.min.js
          curl --fail --location --retry 3 --silent --show-error \
            https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/5.0.8/jspdf.plugin.autotable.min.js \
            --output app/src/main/assets/vendor/jspdf.plugin.autotable.min.js
          test -s app/src/main/assets/vendor/jspdf.umd.min.js
          test -s app/src/main/assets/vendor/jspdf.plugin.autotable.min.js

      - name: Validar arquivos do aplicativo
        shell: bash
        run: |
          node --check app/src/main/assets/app.js
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path("app/src/main/res").rglob("*.xml"):
              ET.parse(p)
          ET.parse("app/src/main/AndroidManifest.xml")
          print("JS e XML válidos")
          PY

      - name: Compilar APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Preparar APK para download
        shell: bash
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/debug/app-debug.apk entrega/Casa-do-Samir.apk
          sha256sum entrega/Casa-do-Samir.apk > entrega/Casa-do-Samir.sha256.txt

      - name: Publicar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Casa-do-Samir-APK
          path: entrega/
          if-no-files-found: error
          retention-days: 30
